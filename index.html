<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 模型价格库 · Explorer</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bd:#30363d;--fg:#e6edf3;--dim:#8b949e;--acc:#58a6ff;--grn:#3fb950;--org:#d29922;--red:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:60px}
header{position:sticky;top:0;z-index:10;background:rgba(13,17,23,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);padding:14px 20px 0}
h1{font-size:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1 .sub{color:var(--dim);font-size:12px;font-weight:400}
.badges{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.badge{background:var(--bg2);border:1px solid var(--bd);border-radius:20px;padding:2px 12px;font-size:12px;color:var(--dim)}
.badge b{color:var(--acc)}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{padding:8px 18px;border:1px solid var(--bd);border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;color:var(--dim);background:transparent;font-size:14px}
.tab.on{color:var(--fg);background:var(--bg2);font-weight:600}
main{max-width:1280px;margin:0 auto;padding:16px 20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{background:var(--bg2);border:1px solid var(--bd);border-radius:6px;color:var(--fg);padding:7px 10px;font-size:13px}
input[type=search]{flex:1;min-width:200px}
input:focus,select:focus{outline:1px solid var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg2);border-radius:8px;overflow:hidden}
th{background:#1c2128;text-align:left;padding:9px 10px;color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:118px}
th:hover{color:var(--acc)}
td{padding:8px 10px;border-top:1px solid var(--bd)}
tr:hover td{background:#1a2029}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:10px;padding:0 8px;font-size:11px;line-height:18px}
.pill.in{background:#12351f;color:var(--grn)}.pill.out{background:#3a2210;color:var(--org)}
.pill.mix{background:#12283f;color:var(--acc)}.pill.other{background:#2d333b;color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:14px}
.card h3{font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.card .kv{font-size:12px;color:var(--dim);margin:3px 0;word-break:break-all}
.card a{color:var(--acc);text-decoration:none}
.tag{display:inline-block;background:#1c2128;border:1px solid var(--bd);border-radius:4px;padding:0 6px;font-size:11px;color:var(--acc);margin:2px 2px 0 0;cursor:pointer}
.grp{margin-bottom:14px}
.grp>.head{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.grp>.head b{font-size:14px}
.grp>.head span{color:var(--dim);font-size:12px}
.grp>.body{display:none;border:1px solid var(--bd);border-top:none;border-radius:0 0 8px 8px;padding:6px 14px}
.grp.open>.body{display:block}
.plan-row{display:grid;grid-template-columns:180px 90px 1fr;gap:10px;padding:8px 0;border-top:1px solid #21262d;font-size:13px;align-items:baseline}
.plan-row:first-child{border-top:none}
.price{color:var(--grn);font-weight:600;text-align:right;white-space:nowrap}
.quota{color:var(--dim);font-size:12px}
.models{grid-column:1/4;font-size:11px;color:var(--acc);word-break:break-all}
.empty{color:var(--dim);text-align:center;padding:40px}
.copy{background:var(--bd);color:var(--fg);border:none;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;margin-left:6px}
footer{text-align:center;color:var(--dim);font-size:12px;padding:30px 0 10px}
</style>
</head>
<body>
<header>
  <h1>🗄️ AI 模型价格库 <span class="sub" id="meta"></span></h1>
  <div class="badges" id="badges"></div>
  <div class="tabs">
    <button class="tab on" data-t="pricing">💰 模型 API 价格</button>
    <button class="tab" data-t="plans">📦 订阅套餐</button>
    <button class="tab" data-t="api">🔌 API 接入</button>
  </div>
</header>
<main>
  <!-- 价格 -->
  <section id="v-pricing">
    <div class="bar">
      <input type="search" id="q-p" placeholder="搜索模型名… 如 deepseek / gemini / gpt">
      <select id="f-plat"><option value="">全部平台</option></select>
      <select id="f-type"><option value="">全部类型</option></select>
      <span class="badge" id="cnt-p"></span>
    </div>
    <table><thead><tr>
      <th data-s="platform">平台 ▾</th><th data-s="model_name">模型 ▾</th>
      <th data-s="item_type">类型 ▾</th><th class="num" data-s="price_usd">$ /Mtok ▾</th>
      <th class="num" data-s="price_cny">¥ /Mtok ▾</th><th class="num">峰谷价(¥)</th>
    </tr></thead><tbody id="tb-p"></tbody></table>
    <div class="empty" id="no-p" style="display:none">无匹配结果</div>
  </section>

  <!-- 套餐 -->
  <section id="v-plans" style="display:none">
    <div class="bar"><input type="search" id="q-pl" placeholder="搜索套餐/额度/包含模型…"><span class="badge" id="cnt-pl"></span></div>
    <div id="plan-groups"></div>
  </section>

  <!-- API -->
  <section id="v-api" style="display:none">
    <div class="bar"><input type="search" id="q-a" placeholder="搜索平台…"><span class="badge" id="cnt-a"></span></div>
    <div class="cards" id="api-cards"></div>
  </section>
</main>

  if(/输入/.test(t)) return 'in';
  if(/输出/.test(t)) return 'out';
  return t==='综合价·$M'?'mix':/图像|视频|语音/.test(t)?'other':'mix';
}
function renderP(){
  const q=$('#q-p').value.toLowerCase(), fp=$('#f-plat').value, ft=$('#f-type').value;
  let rows = DATA.pricing.filter(p=>
    (!fp||p.platform===fp)&&(!ft||p.item_type===ft)&&
    (!q||(p.model_name+' '+p.platform).toLowerCase().includes(q)));
  rows.sort((a,b)=>((a[sortK]??-1)<(b[sortK]??-1)?-1:1)*sortAsc);
  $('#cnt-p').textContent = rows.length+' 条';
  $('#no-p').style.display = rows.length?'none':'block';
  $('#tb-p').innerHTML = rows.slice(0,800).map(p=>`<tr>
    <td>${esc(p.platform)}</td><td><b>${esc(p.model_name)}</b></td>
    <td><span class="pill ${typePill(p.item_type)}">${esc(p.item_type)}</span></td>
    <td class="num">${p.price_usd!=null?p.price_usd:'—'}</td>
    <td class="num">${p.price_cny!=null?p.price_cny:'—'}</td>
    <td class="num">${p.peak_price_cny?`${p.peak_price_cny}/${p.offpeak_price_cny}`:''}</td></tr>`).join('');
}
['#q-p','#f-plat','#f-type'].forEach(s=>$(s).addEventListener('input',renderP));
document.querySelectorAll('#v-pricing th[data-s]').forEach(th=>th.onclick=()=>{
  sortK=th.dataset.s; sortAsc*=-1; renderP();
});
renderP();

// ---- plans tab ----
const byPlat={};
DATA.plans.forEach(p=>{(byPlat[p.platform]=byPlat[p.platform]||[]).push(p)});
function renderPl(){
  const q=$('#q-pl').value.toLowerCase();
  let html='', n=0;
  Object.keys(byPlat).sort().forEach(pl=>{
    const list=byPlat[pl].filter(p=>!q||JSON.stringify(p).toLowerCase().includes(q));
    if(!list.length)return; n+=list.length;
    html+=`<div class="grp open"><div class="head" onclick="this.parentElement.classList.toggle('open')">
      <b>${esc(pl)}</b><span>${list.length} 档</span></div><div class="body">`+
      list.map(p=>`<div class="plan-row">
        <div><b>${esc(p.plan_name)}</b></div>
        <div class="price">${p.price_cny!=null?(p.price_cny?('¥'+(+p.price_cny).toFixed(1).replace(/\.0$/,'')):'待核'):''}<span style="color:var(--dim);font-weight:400"> /${esc(p.period||'mo')}</span></div>
        <div class="quota">${esc(p.quota_desc||'')}</div>
        ${p.models_included?`<div class="models">🧠 ${esc(p.models_included)}</div>`:''}</div>`).join('')+
      '</div></div>';
  });
  $('#plan-groups').innerHTML=html||'<div class="empty">无匹配套餐</div>';
  $('#cnt-pl').textContent=n+' 档';
}
$('#q-pl').addEventListener('input',renderPl); renderPl();

// ---- api tab ----
const apis = DATA.platforms.filter(p=>p.api_docs_url||p.openai_compatible);
function renderApi(){
  const q=$('#q-a').value.toLowerCase();
  const list=apis.filter(p=>!q||JSON.stringify(p).toLowerCase().includes(q));
  $('#cnt-a').textContent=list.length+' 平台';
  $('#api-cards').innerHTML=list.map(p=>`<div class="card">
    <h3>${esc(p.name)} <span style="font-size:11px;color:var(--dim)">${esc(p.region||'')}</span></h3>
    ${p.api_base_url?`<div class="kv">🔗 <code>${esc(p.api_base_url)}</code><button class="copy" onclick="cp(this)">复制</button></div>`:''}
    ${p.api_docs_url?`<div class="kv">📚 <a href="${esc(p.api_docs_url)}" target="_blank">${esc(p.api_docs_url)}</a></div>`:''}
    ${p.openai_compatible?`<div class="kv">🔌 ${esc(p.openai_compatible)}</div>`:`<div class="kv">无公开API</div>`}
    ${p.url?`<div class="kv">🏠 <a href="${esc(p.url)}" target="_blank">官网</a></div>`:''}</div>`).join('')
    ||'<div class="empty">无匹配</div>';
}
$('#q-a').addEventListener('input',renderApi); renderApi();
function cp(btn){navigator.clipboard.writeText(btn.previousElementSibling.textContent.trim());btn.textContent='✓'}
</script>
</body>
</html>
