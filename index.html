<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price Atlas — AI Model &amp; Subscription Prices</title>
<meta name="description" content="Verified pricing for 92 AI providers, 581 models, 1,323 API prices and 194 subscription plans. Dual-timestamp provenance, offline-first single-file explorer.">
<meta property="og:title" content="LLM Price Atlas">
<meta property="og:description" content="Verified AI pricing across 92 providers — compare models, plans and API endpoints offline.">
<meta property="og:image" content="https://moyu-good.github.io/llm-price-atlas/docs/explorer_hero.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230c0d10'/%3E%3Ctext x='32' y='42' font-family='Georgia' font-size='30' fill='%23c9ae6e' text-anchor='middle'%3EPA%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0c0d10;--s1:#12141a;--line:rgba(233,230,223,.09);--gold:#c9ae6e;--tx:#e9e6df;--tx2:#8e8a80}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:60px;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* ---- masthead ---- */
.mast{padding:26px 0 18px;text-align:center;border-bottom:1px solid var(--line)}
.wordmark{font:400 15px/1 Georgia,serif;letter-spacing:.42em;color:var(--gold);text-transform:uppercase;text-indent:.42em}
.dateline{margin-top:9px;font-size:11px;color:var(--tx2);letter-spacing:.06em}
.rules{display:flex;flex-direction:column;gap:3px;margin-top:16px}
.rules i{display:block;height:1px;background:var(--line)}
.rules i:last-child{opacity:.45}

/* ---- stats ---- */
.stats{display:flex;justify-content:center;margin:26px 0 8px}
.stat{padding:0 34px;text-align:center;border-left:1px solid var(--line)}
.stat:first-child{border-left:none}
.stat b{display:block;font:650 31px/1.1 Georgia,serif;color:var(--tx);font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:5px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx2)}

/* ---- tabs ---- */
.tabs{display:flex;justify-content:center;gap:34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;margin-top:22px}
.tab{background:none;border:none;color:var(--tx2);font-size:11px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;padding:4px 2px;border-bottom:1px solid transparent}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}

main{padding-top:26px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
input,select{background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--tx);padding:7px 2px;font-size:13px;border-radius:0}
input[type=search]{flex:1;min-width:180px}
input:focus,select:focus{outline:none;border-bottom-color:var(--gold)}
select option{background:var(--s1);color:var(--tx)}
.count{font-size:12px;color:var(--tx2);white-space:nowrap;font-variant-numeric:tabular-nums}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx2);font-weight:500;text-align:left;padding:8px 12px;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid var(--line)}
th:hover{color:var(--gold)}
td{padding:11px 12px;border-bottom:1px solid rgba(233,230,223,.05)}
tbody tr:hover td{background:var(--s1)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.type{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2)}
.chip{background:none;border:1px solid var(--line);color:var(--gold);border-radius:20px;padding:2px 10px;font-size:11px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--gold)}
.empty{color:var(--tx2);text-align:center;padding:46px}
.pager{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}
.pager button{background:none;border:1px solid var(--line);color:var(--tx);border-radius:3px;padding:3px 14px;cursor:pointer}
.pager button:hover:not(:disabled){border-color:var(--gold)}
.pager button:disabled{opacity:.3;cursor:default}

/* ---- compare expandable detail ---- */
tr.det>td{background:var(--s1);cursor:default}
.qrow{padding:4px 0;font-size:12.5px;color:var(--tx2);border-bottom:1px dashed rgba(233,230,223,.05)}
.qrow:last-child{border-bottom:none}
.qrow b{color:var(--tx)}

/* ---- plans accordion ---- */
.grp{border-top:1px solid var(--line)}
.grp>.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 4px;cursor:pointer}
.grp>.head b{font:650 15px Georgia,serif;letter-spacing:.02em}
.grp>.head:hover b{color:var(--gold)}
.grp>.head span{font-size:11px;color:var(--tx2);letter-spacing:.1em;text-transform:uppercase}
.grp>.body{display:none;padding:2px 4px 16px}
.grp.open>.body{display:block}
.plan-row{display:grid;grid-template-columns:minmax(150px,190px) minmax(80px,110px) 1fr;gap:14px;padding:9px 0;border-top:1px dashed rgba(233,230,223,.06);font-size:13px;align-items:baseline}
.plan-row:first-child{border-top:none}
.plan-name{font-family:Georgia,serif;font-size:14.5px}
.price{color:var(--gold);font-family:Georgia,serif;font-size:16px;text-align:right;white-space:nowrap}
.price small{color:var(--tx2);font-family:inherit;font-size:11px}
.quota{color:var(--tx2);font-size:12.5px;word-break:break-word}
.models{grid-column:1/4;font-size:11.5px;color:var(--tx2);word-break:break-word;line-height:1.7}
.models em{color:var(--gold);font-style:normal;letter-spacing:.08em;text-transform:uppercase;font-size:10px;margin-right:8px}

/* ---- api cards ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.card{background:var(--bg);padding:16px 18px}
.card h3{font:650 14.5px Georgia,serif;display:flex;justify-content:space-between;gap:6px;margin-bottom:8px}
.kv{font-size:12px;color:var(--tx2);margin:5px 0;word-break:break-all;line-height:1.6}
.kv code{color:var(--tx);font-size:11.5px}
.copy{background:none;border:1px solid var(--line);color:var(--gold);border-radius:3px;padding:1px 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin-left:8px}
.copy:hover{border-color:var(--gold)}

footer{border-top:1px solid var(--line);margin-top:44px;padding:22px;text-align:center;font-size:11px;color:var(--tx2);letter-spacing:.04em}
@media(max-width:720px){.stats{flex-wrap:wrap;gap:14px 0}.stat{padding:0 18px}.plan-row{grid-template-columns:1fr}.price{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">

<section id="v-prices" hidden>

  </tr></thead><tbody id="tb-p"></tbody></table></div>
  <div class="empty" id="no-p" hidden></div>
  <div class="pager" id="pager-p"></div>
</section>

<section id="v-plans" hidden>
  <div class="bar"><input type="search" id="q-pl"><span class="count" id="cnt-pl"></span></div>
  <div id="plan-groups"></div>
</section>

<section id="v-api" hidden>
  <div class="bar"><input type="search" id="q-a"><span class="count" id="cnt-a"></span></div>

</section>
</main>
</div>

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n==null ? '—' : (+n).toFixed(+(+n).toFixed(4).split('.')[1]===''?0:Math.min(4,(+n).toFixed(4).split('.')[1].length));

const T = {

let LANG = localStorage.getItem('pa-lang') || 'en';
const t = k => T[LANG][k] ?? k;
const TYPE_EN = {'输入':'Input','输出':'Output','综合价·$M':'Blended','输入·缓存命中':'Cache-hit input',
                 '输入·缓存未命中':'Cache-miss input'};
const tt = s => LANG==='en' ? (TYPE_EN[s]||(s||'').replace('输入','Input').replace('输出','Output')) : (s||'');

function applyLang(){
  document.documentElement.lang = LANG==='zh'?'zh-CN':'en';
  $('#lang').innerHTML = LANG==='en' ? '<b>EN</b>&nbsp;/&nbsp;中文' : 'EN&nbsp;/&nbsp;<b>中文</b>';
  $('#lang').style.cssText='background:none;border:none;color:'+(LANG==='en'?'#fff':'var(--tx2)')+';cursor:pointer;font-size:11px;letter-spacing:.1em';
  $$('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.textContent=t('tabs')[b.dataset.t]);
  ['#q-c','#q-p','#q-pl','#q-a'].forEach((s,i)=>$(s).placeholder=[t('qCompare'),t('qPrices'),t('qPlans'),t('qApi')][i]);
  $('#f-cp option').textContent=t('allPlat'); $('#f-pp option').textContent=t('allPlat');
  $('#f-pt option').textContent=t('allType');
  $('#meta').textContent = `${t('updated')} · ${DATA.meta.updated} · ${t('fx')}`;
  const S=[['platforms',t('providers')],['models','models'.replace('models',LANG==='en'?'models':'模型')],
           ['pricing_rows',t('rows')],['plan_rows',t('tiers')]];
  $('#badges').innerHTML =
    `<div class="stat"><b>${DATA.meta.platforms}</b><span>${LANG==='en'?'Providers':'平台'}</span></div>`+
    `<div class="stat"><b>${DATA.meta.models}</b><span>${LANG==='en'?'Models':'模型'}</span></div>`+
    `<div class="stat"><b>${DATA.meta.pricing_rows.toLocaleString()}</b><span>${LANG==='en'?'API prices':'按量价格'}</span></div>`+
    `<div class="stat"><b>${DATA.meta.plan_rows}</b><span>${LANG==='en'?'Subscriptions':'订阅套餐'}</span></div>`;
  renderAll();
}

/* routing */
const VIEWS=['compare','prices','plans','api'];
function show(k){
  VIEWS.forEach(v=>{$('#v-'+v).hidden=v!==k;
    $(`#tabs .tab[data-t=${v}]`).classList.toggle('on',v===k)});
  history.replaceState(null,'','#'+k);
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)show(b.dataset.t)});
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(VIEWS.includes(k))show(k)});

function typeLbl(p){return `<span class="type">${esc(tt(p.item_type))}</span>`}

/* ===== compare ===== */
const aggModels=(()=>{
  const m={};
  DATA.pricing.forEach(p=>{
    const o=m[p.model_name]||={model:p.model_name,ch:new Set(),in:null,inP:null,out:null,outP:null,flat:null,quotes:[]};
    o.quotes.push(p); o.ch.add(p.platform);
    const bet=(a,b)=>a==null||b<a;
    if(/^输入/.test(p.item_type)&&p.price_usd!=null&&bet(o.in,p.price_usd)){o.in=p.price_usd;o.inP=p.platform}
    else if(p.item_type==='输出'&&p.price_usd!=null&&bet(o.out,p.price_usd)){o.out=p.price_usd;o.outP=p.platform}
    else if(/综合价/.test(p.item_type)&&p.price_usd!=null&&bet(o.flat,p.price_usd)) o.flat=p.price_usd;
  });
  return Object.values(m).map(o=>({...o,nch:o.ch.size,
    total:(o.in!=null&&o.out!=null)?o.in+o.out:(o.flat??null)}))
    .filter(o=>o.total!=null).sort((a,b)=>a.total-b.total);
})();
let cSort={k:'total',asc:1}, cOpen=new Set();
function renderC(){
  const q=$('#q-c').value.toLowerCase(), fp=$('#f-cp').value;
  let list=aggModels.filter(o=>(!fp||o.ch.has(fp))&&(!q||o.model.toLowerCase().includes(q)));
  const{k,asc}=cSort;
  list.sort((a,b)=>((a[k]??Infinity)>(b[k]??Infinity)?1:-1)*asc);
  $('#cnt-c').textContent=list.length+' '+t('rows');
  $('#no-c').hidden=list.length>0;
  const head={model:t('colModel'),ch:t('srcs'),'in$':t('inLbl')||'',out$:t('outLbl')||'',total:''};
  const lbl={'model':t('colModel'),'ch':LANG==='en'?'Sources':'渠道','in$':LANG==='en'?'Best input':'最低输入',
             'out$':LANG==='en'?'Best output':'最低输出','total':LANG==='en'?'In + Out':'输入+输出'};
  $$('#v-compare th[data-s]').forEach(th=>th.textContent=lbl[th.dataset.s]+(cSort.k===th.dataset.s?(cSort.asc?' ↑':' ↓'):''));
  $('#tb-c').innerHTML=list.map(o=>{
    const open=cOpen.has(o.model), key=esc(o.model).replace(/'/g,"\\'");
    let h=`<tr style="cursor:pointer" onclick="toggleDet(this,'${key}')">
      <td><b>${esc(o.model)}</b></td>
      <td class="num">${o.nch}</td>
      <td class="num">${o.in!=null?fmt(o.in)+'<span style="color:var(--tx2);font-size:11px"> @'+esc(o.inP)+'</span>':(o.flat!=null?fmt(o.flat)+'<span style="color:var(--tx2);font-size:11px"> ('+t('flatNote')+')</span>':'—')}</td>
      <td class="num">${o.out!=null?fmt(o.out)+'<span style="color:var(--tx2);font-size:11px"> @'+esc(o.outP)+'</span>':'—'}</td>
      <td class="num" style="color:var(--gold);font-family:Georgia,serif;font-size:14px">${fmt(o.total)}</td>
      <td class="num"><span class="chip">${o.nch} ${t('expand')}</span></td></tr>`;
    if(open){
      h+=`<tr class="det"><td colspan="6" style="padding:8px 24px 14px">`+
        o.quotes.map(p=>`<div class="qrow"><b>${esc(p.platform)}</b> · ${esc(p.item_type)} — `+
          `${p.price_usd!=null?'$'+fmt(p.price_usd)+' /Mtok':''} ${p.source_url?`· <a href="${esc(p.source_url)}" target="_blank" rel="noopener">${LANG==='en'?'source':'出处'}</a>`:''}</div>`).join('')+
        '</td></tr>';
    }
    return h}).join('');
}
window.toggleDet=(tr,model)=>{cOpen.has(model)?cOpen.delete(model):cOpen.add(model);renderC()};

/* ===== prices ===== */
let pSort={k:'price_usd',asc:1}, pPage=1; const PP=100;
function renderP(){
  const q=$('#q-p').value.toLowerCase(), fp=$('#f-pp').value, ft=$('#f-pt').value;
  const all=DATA.pricing.filter(p=>(!fp||p.platform===fp)&&(!ft||p.item_type===ft)&&
    (!q||(p.model_name+' '+p.platform).toLowerCase().includes(q)));
  const{k,asc}=pSort;
  all.sort((a,b)=>((a[k]??-1)>(b[k]??-1)?1:-1)*asc);
  const pages=Math.max(1,Math.ceil(all.length/PP)); pPage=Math.min(pPage,pages);
  const slice=all.slice((pPage-1)*PP,pPage*PP);
  $('#cnt-p').textContent=all.length+' '+t('rows');
  $('#no-p').hidden=all.length>0;
  const lbl={platform:t('colProv'),model_name:t('colModel'),item_type:LANG==='en'?'Type':'类型'};
  $$('#v-prices th[data-s]').forEach(th=>{
    th.textContent=(lbl[th.dataset.s]||th.textContent.replace(/[↑↓]/g,''))+(pSort.k===th.dataset.s?(pSort.asc?' ↑':' ↓'):'')});
  $('#tb-p').innerHTML=slice.map(p=>`<tr>
    <td>${esc(p.platform)}</td><td><b>${esc(p.model_name)}</b></td>
    <td>${typeLbl(p)}</td>
    <td class="num">${fmt(p.price_usd)}</td><td class="num">${fmt(p.price_cny)}</td>
    <td class="num" style="color:var(--tx2)">${p.peak_price_cny?`${fmt(p.peak_price_cny)} / ${fmt(p.offpeak_price_cny)}`:'—'}</td></tr>`).join('');
  $('#pager-p').innerHTML=pages<=1?'':
    `<button ${pPage<=1?'disabled':''} onclick="goP(${pPage-1})">‹</button>
     ${t('page')} ${pPage} / ${pages}
     <button ${pPage>=pages?'disabled':''} onclick="goP(${pPage+1})">›</button>`;
}
window.goP=n=>{pPage=n;renderP()};
['#q-p','#f-pp','#f-pt'].forEach(s=>$(s).addEventListener('input',()=>{pPage=1;renderP()}));

/* ===== plans ===== */
const byPlat={};
DATA.plans.forEach(p=>{(byPlat[p.platform]=byPlat[p.platform]||[]).push(p)});
function renderPL(){
  const q=$('#q-pl').value.toLowerCase();
  let html='',n=0;
  Object.keys(byPlat).sort().forEach(pl=>{
    const list=byPlat[pl].filter(p=>!q||JSON.stringify(p).toLowerCase().includes(q));
    if(!list.length)return; n+=list.length;
    html+=`<div class="grp${q?' open':''}"><div class="head" onclick="this.parentElement.classList.toggle('open')">
      <b>${esc(pl)}</b><span>${list.length} ${t('tiers')}</span></div><div class="body">`+
      list.map(p=>`<div class="plan-row">
        <div class="plan-name">${esc(p.plan_name)}</div>
        <div class="price">${p.price_cny!=null?(+p.price_cny?('¥'+(+p.price_cny).toFixed(1).replace(/\.0$/,'')):'—'):''}<small>/${esc(p.period||'mo')}</small></div>
        <div class="quota">${esc(p.quota_desc||'')}</div>
        ${p.models_included?`<div class="models"><em>${t('incl')}</em>${esc(p.models_included)}</div>`:''}</div>`).join('')+'</div></div>';
  });
  $('#plan-groups').innerHTML=html||`<div class="empty">${t('noResult')}</div>`;
  $('#cnt-pl').textContent=n+' '+t('tiers');
}
$('#q-pl').addEventListener('input',renderPL);

/* ===== api ===== */
const apis=DATA.platforms.filter(p=>p.api_docs_url||p.openai_compatible);
function renderA(){
  const q=$('#q-a').value.toLowerCase();
  const list=apis.filter(p=>!q||JSON.stringify(p).toLowerCase().includes(q));
  $('#cnt-a').textContent=list.length+' '+t('providers');
  $('#api-cards').innerHTML=list.map(p=>`<div class="card">
    <h3>${esc(p.name)}<span style="font-size:10px;color:var(--tx2);letter-spacing:.14em;text-transform:uppercase;align-self:center">${esc(p.region||'')}</span></h3>
    ${p.api_base_url?`<div class="kv">ENDPOINT · <code>${esc(p.api_base_url)}</code><button class="copy" onclick="cp(this)">${t('copy')}</button></div>`:''}
    ${p.api_docs_url?`<div class="kv">DOCS · <a href="${esc(p.api_docs_url)}" target="_blank" rel="noopener">${esc(p.api_docs_url)}</a></div>`:''}
    <div class="kv">${esc(p.openai_compatible||t('noApi'))}</div>
    ${p.url?`<div class="kv"><a href="${esc(p.url)}" target="_blank" rel="noopener">${t('site')} ↗</a></div>`:''}</div>`).join('')
    ||`<div class="empty">${t('noResult')}</div>`;
}
$('#q-a').addEventListener('input',renderA);
window.cp=b=>{navigator.clipboard.writeText(b.previousElementSibling.querySelector('code').textContent);b.textContent=t('copied')};

/* boot */
function renderAll(){renderC();renderP();renderPL();renderA()}
[...new Set(DATA.pricing.map(p=>p.platform))].sort().forEach(pl=>{
  [['#f-cp'],['#f-pp']].forEach(([s])=>{const o=document.createElement('option');o.value=pl;o.textContent=pl;$(s).appendChild(o)})});
[...new Set(DATA.pricing.map(p=>p.item_type))].sort().forEach(tp=>{
  const o=document.createElement('option');o.value=tp;o.textContent=tp;$('#f-pt').appendChild(o)});
$('#lang').onclick=()=>{LANG=LANG==='en'?'zh':'en';localStorage.setItem('pa-lang',LANG);applyLang()};
$('#q-c').addEventListener('input',renderC);
$('#f-cp').addEventListener('input',renderC);
$$('#v-compare th[data-s]').forEach(th=>th.onclick=()=>{
  cSort=cSort.k===th.dataset.s?{k:th.dataset.s,asc:-cSort.asc}:{k:th.dataset.s,asc:1};renderC()});
$$('#v-prices th[data-s]').forEach(th=>th.onclick=()=>{
  pSort=pSort.k===th.dataset.s?{k:th.dataset.s,asc:-pSort.asc}:{k:th.dataset.s,asc:1};pPage=1;renderP()});
applyLang();
show(VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'compare');
</script>
